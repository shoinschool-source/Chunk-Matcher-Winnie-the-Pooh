<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EPI 構文対戦 (Classroom Battle)</title>
    <!-- Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --accent-blue: #0284c7;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #fde047;
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background-image: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 80%);
        }

        .app-container {
            width: 100%;
            max-width: 960px;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-height: 580px;
        }

        .header-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .header-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #38bdf8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .round-badge {
            background: rgba(168, 85, 247, 0.2);
            color: #c084fc;
            border: 1px solid rgba(192, 132, 252, 0.4);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .lobby-box {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: center;
            padding: 0.5rem 0;
            text-align: center;
            width: 100%;
        }

        .input-group {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            text-align: left;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .input-field {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem;
            color: #fff;
            font-size: 1rem;
        }

        .tv-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
            width: 100%;
            align-items: start;
        }

        @media (max-width: 768px) {
            .tv-layout {
                grid-template-columns: 1fr;
            }
        }

        .tv-sidebar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
        }

        .qr-card {
            background: #fff;
            padding: 8px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .qr-card img {
            width: 140px;
            height: 140px;
            display: block;
        }

        .groups-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            max-height: 380px;
            overflow-y: auto;
            width: 100%;
        }

        @media (min-width: 600px) {
            .groups-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 800px) {
            .groups-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .group-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.7rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            min-height: 110px;
        }

        .group-card-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: #38bdf8;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.3rem;
            display: flex;
            justify-content: space-between;
        }

        .group-member-list {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            overflow-y: auto;
            max-height: 70px;
        }

        .group-member-tag {
            background: rgba(30, 41, 59, 0.9);
            color: var(--text-main);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .waiting-room-box {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .waiting-members-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            width: 100%;
            min-height: 60px;
            background: rgba(30, 41, 59, 0.6);
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .waiting-tag {
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .leaderboard-panel {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 140px;
            overflow-y: auto;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.8);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .scaffold-stage {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .scaffold-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scaffold-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .sentence-counter {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-yellow);
        }

        .jp-prompt-box {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 1.05rem;
            font-weight: 700;
            background: rgba(30, 41, 59, 0.9);
            padding: 0.75rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            min-height: 52px;
        }

        .jp-chunk {
            color: #ffffff;
            background: rgba(56, 189, 248, 0.15);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .slot-container {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            min-height: 64px;
            padding: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filled-slot {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            border: 1px solid #38bdf8;
        }

        .empty-slot {
            background: rgba(30, 41, 59, 0.6);
            border: 2px dashed var(--border-color);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .chain-container {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            min-height: 58px;
            padding: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0.5rem;
            overflow-x: auto;
        }

        .placeholder-hint {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 700;
            width: 100%;
            text-align: center;
        }

        .tile-tag {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .blank-stage {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .blank-sentence-display {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f1f5f9;
        }

        .blank-word-slot {
            display: inline-block;
            background: rgba(56, 189, 248, 0.2);
            border-bottom: 3px solid var(--accent-yellow);
            color: var(--accent-yellow);
            padding: 0.1rem 0.8rem;
            border-radius: 6px;
            margin: 0 0.3rem;
        }

        .round3-interaction-area {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }

        .word-options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.65rem;
        }

        @media (min-width: 500px) {
            .word-options-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .word-btn {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-bottom: 3px solid var(--accent-green);
            border-radius: 10px;
            color: #f1f5f9;
            padding: 0.6rem 0.4rem;
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
        }

        .word-btn-en {
            font-size: 1rem;
            font-weight: 700;
        }

        .word-btn-jp {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-yellow);
        }

        .chunk-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.65rem;
        }

        @media (min-width: 500px) {
            .chunk-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .grid-btn {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-bottom: 3px solid var(--accent-blue);
            border-radius: 10px;
            color: #f1f5f9;
            padding: 0.7rem 0.4rem;
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grid-btn.error, .word-btn.error {
            background: #991b1b !important;
            border-color: var(--accent-red) !important;
        }

        .grid-btn.cleared {
            opacity: 0;
            visibility: hidden;
            pointer-events: none !important;
        }

        .action-btn {
            width: 100%;
            max-width: 320px;
            background: var(--accent-blue);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 0.9rem 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }

        .action-btn-green {
            background: var(--accent-green);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 16px;
            z-index: 200;
            padding: 2rem;
        }

        .countdown-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid var(--accent-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--accent-yellow);
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header-banner">
            <div class="header-title">EPI 構文対戦 (Classroom Battle)</div>
            <div id="round-indicator" class="round-badge" style="display: none;">ラウンド 1</div>
        </div>

        <!-- Network / Configuration Error Overlay -->
        <div id="network-error-overlay" class="overlay" style="display: none; background: rgba(15, 23, 42, 0.98);">
            <h2 style="color: var(--accent-red); font-size: 1.8rem; font-weight: 900; margin-bottom: 0.8rem;">⚠️ Supabase 接続エラー</h2>
            <p id="error-message-text" style="color: var(--text-main); font-size: 1rem; line-height: 1.6; max-width: 480px; margin-bottom: 1.5rem; font-weight: 500;"></p>
            <button class="action-btn" onclick="location.reload()">再読み込みする</button>
        </div>

        <div id="lobby-screen" class="lobby-box">
            <!-- TV / Admin Projector View -->
            <div id="tv-display-view" style="display: none; width: 100%; flex-direction: column; gap: 1rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <h2 style="color: #38bdf8; font-size: 1.2rem; font-weight: 900;">📺 クラスルーム班対抗 ライブロビー</h2>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="action-btn" style="max-width: 160px; padding: 0.7rem 0.5rem; background: #334155; font-size: 0.85rem;" onclick="clearAllDatabasePlayers()">🗑️ 履歴クリア</button>
                        <button class="action-btn action-btn-green" style="max-width: 220px; padding: 0.7rem 1rem;" onclick="adminStartAllGroups()">🚀 一斉スタート</button>
                    </div>
                </div>
                <div class="tv-layout">
                    <div class="tv-sidebar">
                        <p style="color: #38bdf8; font-size: 0.8rem; font-weight: 700; text-align: center; line-height: 1.3;">
                            スマホでQRをスキャンして参加！
                        </p>
                        <div class="qr-card">
                            <img id="tv-qr-img" alt="Join QR Code">
                        </div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.4rem; width: 100%;">
                        <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-align: left;">
                            👥 各グループの参加メンバー状況
                        </div>
                        <div class="groups-grid" id="tv-groups-grid">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Student Device Login View -->
            <div id="student-input-view" style="display: none; flex-direction: column; align-items: center; gap: 1rem; width: 100%;">
                <h2 style="color: #38bdf8; font-size: 1.3rem; font-weight: 900;">グループ参加設定</h2>
                <div class="input-group">
                    <label>あなたの名前（ニックネーム）</label>
                    <input type="text" id="player-name-input" class="input-field" value="ゲスト生">
                </div>

                <div class="input-group">
                    <label>参加するグループ（班）を選択</label>
                    <select id="room-code-select" class="input-field">
                        <option value="group-1">グループ 1</option>
                        <option value="group-2">グループ 2</option>
                        <option value="group-3">グループ 3</option>
                        <option value="group-4">グループ 4</option>
                        <option value="group-5">グループ 5</option>
                        <option value="group-6">グループ 6</option>
                        <option value="group-7">グループ 7</option>
                        <option value="group-8">グループ 8</option>
                        <option value="group-9">グループ 9</option>
                        <option value="group-10">グループ 10</option>
                    </select>
                </div>

                <button class="action-btn" onclick="enterWaitingRoom()">🚀 待機ルームに入室する</button>
            </div>
        </div>

        <!-- Student Waiting Room -->
        <div id="waiting-room-view" style="display: none; flex-direction: column; align-items: center; gap: 1.2rem; padding: 1.5rem 0;">
            <div class="waiting-room-box">
                <h3 id="waiting-room-title" style="color: #38bdf8; font-size: 1.2rem; font-weight: 900;">グループ待機ルーム</h3>
                <p style="color: var(--accent-yellow); font-size: 0.95rem; font-weight: 700;">⏳ 先生からのスタート号令を待っています...</p>
                
                <div class="waiting-members-grid" id="waiting-members-list">
                    <!-- Member tags -->
                </div>
            </div>
        </div>

        <div id="game-content" style="display: none; flex-direction: column; gap: 1rem;">
            <div class="leaderboard-panel" id="leaderboard-list">
                <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted);" id="current-group-label">🏆 班内リーダーボード</div>
            </div>

            <div class="scaffold-stage">
                <div class="scaffold-header-row">
                    <div class="scaffold-title" id="scaffold-title-text">ターゲット（日本語訳の順序）</div>
                    <div id="sentence-counter" class="sentence-counter">文 1 / 2</div>
                </div>
                <div id="jp-prompt-box" class="jp-prompt-box"></div>
            </div>

            <div id="active-container"></div>
            <div id="chunk-grid"></div>
        </div>

        <div id="round-winner-overlay" class="overlay" style="display: none;">
            <h2 id="round-winner-title" style="font-size: 2rem; font-weight: 900; color: var(--accent-yellow); margin-bottom: 0.5rem;">ラウンドクリア！</h2>
            <p id="round-winner-msg" style="color: var(--text-main); font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem;"></p>
            <p style="color: var(--text-muted); font-size: 0.85rem;">まもなく次のラウンドへ自動的に移動します...</p>
        </div>

        <!-- カウントダウン・ルール説明オーバーレイ -->
        <div id="instruction-overlay" class="overlay" style="display: none;">
            <h3 id="instr-round-title" style="color: var(--accent-yellow); font-size: 1.1rem; font-weight: 900; margin-bottom: 0.3rem;">ラウンド 1 ルール説明</h3>
            <h2 id="instr-main-title" style="font-size: 1.6rem; font-weight: 900; color: #fff; margin-bottom: 1rem;">スロットイン・モード</h2>
            <div id="instr-body" style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; max-width: 440px; margin-bottom: 1rem; font-weight:
