<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EPI 構文対戦 (Syntax Duel)</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Rajdhani:wght@500;600;700&family=Noto+Sans+JP:wght@500;700;900&display=swap');

        :root {
            --accent-blue: #0284c7;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #fde047;
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Noto Sans JP', 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background-image: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 80%);
        }

        .app-container {
            width: 100%;
            max-width: 680px;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-height: 540px;
        }

        .header-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .header-title {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: #38bdf8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .round-badge {
            background: rgba(168, 85, 247, 0.2);
            color: #c084fc;
            border: 1px solid rgba(192, 132, 252, 0.4);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-family: 'Chakra Petch', 'Noto Sans JP', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* LOBBY */
        .lobby-box {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: center;
            padding: 1rem 0;
            text-align: center;
        }

        .qr-card {
            background: #fff;
            padding: 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 0.3rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .qr-card img {
            width: 160px;
            height: 160px;
            display: block;
        }

        /* HUD PANEL */
        .hud-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.6rem;
            text-align: center;
        }

        .hud-label {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .hud-value {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-yellow);
        }

        /* TARGET PROMPT BOX */
        .scaffold-stage {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .scaffold-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scaffold-title {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .sentence-counter {
            font-family: 'Chakra Petch', 'Noto Sans JP', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-yellow);
        }

        .jp-prompt-box {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 1.05rem;
            font-weight: 700;
            background: rgba(30, 41, 59, 0.9);
            padding: 0.75rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            min-height: 52px;
        }

        .jp-chunk {
            color: #ffffff;
            background: rgba(56, 189, 248, 0.15);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .slot-container {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            min-height: 64px;
            padding: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filled-slot {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            border: 1px solid #38bdf8;
        }

        .empty-slot {
            background: rgba(30, 41, 59, 0.6);
            border: 2px dashed var(--border-color);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .chain-container {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            min-height: 58px;
            padding: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0.5rem;
            overflow-x: auto;
        }

        .placeholder-hint {
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 700;
            width: 100%;
            text-align: center;
        }

        .tile-tag {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
        }

        /* ROUND 3 穴埋め専用スタイル */
        .blank-stage {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .blank-sentence-display {
            font-family: 'Rajdhani', 'Noto Sans JP', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #f1f5f9;
        }

        .blank-word-slot {
            display: inline-block;
            background: rgba(56, 189, 248, 0.2);
            border-bottom: 3px solid var(--accent-yellow);
            color: var(--accent-yellow);
            padding: 0.1rem 0.8rem;
            border-radius: 6px;
            margin: 0 0.3rem;
        }

        .round3-interaction-area {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }

        .word-options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.65rem;
        }

        @media (min-width: 500px) {
            .word-options-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .word-btn {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-bottom: 3px solid var(--accent-green);
            border-radius: 10px;
            color: #f1f5f9;
            padding: 0.6rem 0.4rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
        }

        .word-btn-en {
            font-size: 1rem;
            font-weight: 700;
            color: #f1f5f9;
        }

        .word-btn-jp {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-yellow);
        }

        .word-btn:hover {
            border-color: #34d399;
            background: #1e293b;
        }

        .word-btn.error {
            background: #991b1b !important;
            border-color: var(--accent-red) !important;
            animation: shake 0.3s ease-in-out;
        }

        .chunk-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.65rem;
        }

        @media (min-width: 500px) {
            .chunk-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .grid-btn {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-bottom: 3px solid var(--accent-blue);
            border-radius: 10px;
            color: #f1f5f9;
            padding: 0.7rem 0.4rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .grid-btn:hover {
            border-color: #38bdf8;
            background: #1e293b;
        }

        .grid-btn.error {
            background: #991b1b !important;
            border-color: var(--accent-red) !important;
            animation: shake 0.3s ease-in-out;
        }

        .grid-btn.cleared {
            opacity: 0;
            visibility: hidden;
            pointer-events: none !important;
        }

        .action-btn {
            width: 100%;
            max-width: 320px;
            background: var(--accent-blue);
            color: #fff;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 0.9rem 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }

        .action-btn:hover {
            background: #0369a1;
        }

        /* OVERLAYS & COUNTDOWN */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 16px;
            z-index: 200;
            padding: 2rem;
            overflow-y: auto;
        }

        .countdown-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid var(--accent-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--accent-yellow);
            margin-top: 1rem;
            box-shadow: 0 0 20px rgba(253, 224, 71, 0.3);
            animation: pulse 1s infinite alternate;
        }

        /* スコアテーブル用スタイル */
        .score-table {
            width: 100%;
            max-width: 320px;
            margin: 0.5rem 0 1rem 0;
            border-collapse: collapse;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .score-table th, .score-table td {
            padding: 0.6rem;
            font-size: 0.95rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .score-table th {
            background: rgba(15, 23, 42, 0.9);
            color: var(--text-muted);
            font-family: 'Noto Sans JP', sans-serif;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header-banner">
            <div class="header-title">EPI 構文対戦 (Syntax Duel)</div>
            <div id="round-indicator" class="round-badge" style="display: none;">ラウンド 1</div>
        </div>

        <!-- ロビー画面 -->
        <div id="lobby-screen" class="lobby-box">
            <h2 style="font-family: 'Noto Sans JP', sans-serif; color: #38bdf8; font-size: 1.5rem; font-weight: 900; margin-bottom: 0.2rem;">2人リアルタイム対戦</h2>
            
            <!-- TV / メインディスプレイ用ビュー (パラメータなしの場合に自動表示) -->
            <div id="tv-display-view" style="display: none; flex-direction: column; align-items: center; gap: 0.6rem; width: 100%;">
                <div style="background: rgba(225, 29, 72, 0.15); border: 2px solid #f43f5e; padding: 0.8rem 1rem; border-radius: 10px; max-width: 420px;">
                    <p style="font-family: 'Noto Sans JP', sans-serif; color: #fb7185; font-size: 1.05rem; font-weight: 900; line-height: 1.4;">
                        🛑 【ステップ1】<br>プレイヤー1の端末で下のQRコードをスキャンしてください！
                    </p>
                </div>
                <div class="qr-card">
                    <img id="tv-qr-img" src="" alt="Player 1 Auth QR">
                </div>
            </div>

            <!-- プレイヤー1端末用ビュー (?auth=host の場合に表示) -->
            <div id="p1-host-view" style="display: none; flex-direction: column; align-items: center; gap: 0.6rem; width: 100%;">
                <div id="create-section" style="margin-top: 0.5rem; width: 100%;">
                    <button class="action-btn" onclick="createRoom()">🚀 自分の対戦ルームを作成する</button>
                </div>
                <div id="p2-qr-wrapper" style="display: none; flex-direction: column; align-items: center; gap: 0.6rem; width: 100%;">
                    <div style="background: rgba(16, 185, 129, 0.15); border: 2px solid #10b981; padding: 0.8rem 1rem; border-radius: 10px; max-width: 420px;">
                        <p style="font-family: 'Noto Sans JP', sans-serif; color: #34d399; font-size: 1.05rem; font-weight: 900; line-height: 1.4;">
                            📱 【ステップ2】<br>対戦相手（プレイヤー2）の端末で下のQRコードをスキャンしてください！
                        </p>
                    </div>
                    <div class="qr-card">
                        <img id="p2-qr-img" src="" alt="Player 2 QR">
                    </div>
                </div>
            </div>

            <p id="lobby-msg" style="color: var(--accent-yellow); font-size: 0.95rem; font-weight: 700; margin-top: 0.5rem;"></p>
        </div>

        <!-- ゲームプレイ画面 -->
        <div id="game-content" style="display: none; flex-direction: column; gap: 1rem;">
            <div class="hud-panel">
                <div>
                    <div class="hud-label">自分の進捗</div>
                    <div id="hud-progress" class="hud-value" style="color: var(--accent-green);">0/2</div>
                </div>
                <div>
                    <div class="hud-label">相手の進捗</div>
                    <div id="opponent-progress" class="hud-value" style="color: #38bdf8;">0/2</div>
                </div>
                <div>
                    <div class="hud-label">スコア</div>
                    <div id="hud-score" class="hud-value">0</div>
                </div>
            </div>

            <div class="scaffold-stage">
                <div class="scaffold-header-row">
                    <div class="scaffold-title" id="scaffold-title-text">ターゲット（日本語訳の順序）</div>
                    <div id="sentence-counter" class="sentence-counter">文 1 / 2</div>
                </div>
                <div id="jp-prompt-box" class="jp-prompt-box"></div>
            </div>

            <div id="active-container"></div>
            <div id="chunk-grid"></div>
        </div>

        <!-- ラウンド勝敗発表画面オーバーレイ -->
        <div id="round-winner-overlay" class="overlay" style="display: none;">
            <h2 id="round-winner-title" style="font-family: 'Chakra Petch', 'Noto Sans JP', sans-serif; font-size: 2rem; font-weight: 900; color: var(--accent-yellow); margin-bottom: 0.5rem;">ラウンドクリア！</h2>
            <p id="round-winner-msg" style="color: var(--text-main); font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem;"></p>
            <p style="color: var(--text-muted); font-size: 0.85rem;">まもなく次のラウンドへ自動的に移動します...</p>
        </div>

        <!-- ラウンド説明 ＆ カウントダウンオーバーレイ -->
        <div id="instruction-overlay" class="overlay" style="display: none;">
            <h3 id="instr-round-title" style="font-family: 'Noto Sans JP', sans-serif; color: var(--accent-yellow); font-size: 1.1rem; font-weight: 900; letter-spacing: 1px; margin-bottom: 0.3rem;">ラウンド 1 ルール説明</h3>
            <h2 id="instr-main-title" style="font-family: 'Noto Sans JP', sans-serif; font-size: 1.6rem; font-weight: 900; color: #fff; margin-bottom: 1rem;">スロットイン・モード</h2>
            <div id="instr-body" style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; max-width: 440px; margin-bottom: 1rem; font-weight: 500;"></div>
            <div style="font-family: 'Noto Sans JP', sans-serif; font-size: 0.9rem; color: #38bdf8; font-weight: 700;">対戦開始まで</div>
            <div id="countdown-num" class="countdown-circle">10</div>
        </div>

        <!-- 最終リザルト画面 -->
        <div id="end-overlay" class="overlay" style="display: none;">
            <h2 id="end-title" style="font-family: 'Chakra Petch', 'Noto Sans JP', sans-serif; font-size: 2rem; font-weight: 900; color: var(--accent-green); margin-bottom: 0.4rem;">総合優勝！</h2>
            <p id="end-subtitle" style="color: var(--text-muted); font-size: 0.95rem; font-weight: 700; margin-bottom: 0.5rem;"></p>
            
            <table class="score-table">
                <thead>
                    <tr>
                        <th>ラウンド</th>
                        <th>結果</th>
                    </tr>
                </thead>
                <tbody id="score-table-body">
                    <!-- JavaScriptで挿入 -->
                </tbody>
            </table>

            <button class="action-btn" onclick="location.reload()">もう一度プレイ</button>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;

        const SOURCE_SENTENCES = [
            { id: 1, chunks: ['Today, I’d like to introduce', 'one of my favorite books, Winnie-the-Pooh.'], jpChunks: ['今日は，【私は】紹介したいと思います', '私の一番好きな本のひとつである『クマのプーさん』を。'] },
            { id: 2, chunks: ['I have read this book', 'many times', 'since I was a child.'], jpChunks: ['私はこの本を読んだことがあります', '何回も', '私が子どもの頃から。'] }
        ];

        const ROUND3_QUESTIONS = [
            { fullText: "[BLANK], I’d like to introduce one of my favorite books, Winnie-the-Pooh.", targetWord: "Today", jp: "今日は", options: [
                { en: "Today", jp: "今日" },
                { en: "Yesterday", jp: "昨日" },
                { en: "Tomorrow", jp: "明日" },
                { en: "Now", jp: "今" },
                { en: "Always", jp: "いつも" }
            ] },
            { fullText: "I have read this book many times since I was a [BLANK].", targetWord: "child", jp: "子ども", options: [
                { en: "child", jp: "子ども" },
                { en: "boy", jp: "少年" },
                { en: "girl", jp: "少女" },
                { en: "student", jp: "生徒" },
                { en: "kid", jp: "子供" }
            ] }
        ];

        let currentRound = 1;
        let sentenceQueue = [];
        let currentSentence = null;
        let currentRound3Q = null;
        let gridData = [];
        let activeChain = [];
        let score = 0;
        let progress = 0;
        let isInputLocked = false;
        let activeCountdownTimer = null;
        let lastKnownOpponentProgress = 0;

        let roundResults = { 1: null, 2: null, 3: null };

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const autoRoom = urlParams.get('room');
            const authParam = urlParams.get('auth');

            if (autoRoom) {
                joinRoomAuto(autoRoom);
            } else if (authParam === 'host') {
                document.getElementById('p1-host-view').style.display = 'flex';
                document.getElementById('tv-display-view').style.display = 'none';
                document.getElementById('lobby-msg').textContent = 'ボタンを押して自分の対戦ルームを作成してください';
            } else {
                document.getElementById('tv-display-view').style.display = 'flex';
                document.getElementById('p1-host-view').style.display = 'none';

                const hostAuthUrl = window.location.origin + window.location.pathname + '?auth=host';
                const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(hostAuthUrl)}`;
                document.getElementById('tv-qr-img').src = qrApiUrl;
                document.getElementById('lobby-msg').textContent = 'プレイヤー1の端末で上のQRコードを読み取ってください';
            }
        });

        function shuffle(arr) {
            let newArr = arr.slice();
            for (let i = newArr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                let temp = newArr[i];
                newArr[i] = newArr[j];
                newArr[j] = temp;
            }
            return newArr;
        }

        function createRoom() {
            const code = 'epi-' + Math.floor(1000 + Math.random() * 9000);
            
            if (typeof Peer === 'undefined') {
                alert('通信ライブラリを読み込んでいます。数秒後にもう一度ページを更新してください。');
                return;
            }

            peer = new Peer(code);

            peer.on('open', (id) => {
                document.getElementById('create-section').style.display = 'none';
                document.getElementById('lobby-msg').textContent = '⏳ ルーム作成完了！対戦相手（プレイヤー2）の参加を待っています...';
                
                const p2JoinUrl = window.location.origin + window.location.pathname + '?room=' + id;
                const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(p2JoinUrl)}`;
                
                document.getElementById('p2-qr-img').src = qrApiUrl;
                document.getElementById('p2-qr-wrapper').style.display = 'flex';
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });

            peer.on('error', (err) => {
                document.getElementById('lobby-msg').textContent = '接続エラーが発生しました。再試行してください。';
            });
        }

        function joinRoomAuto(code) {
            if (typeof Peer === 'undefined') {
                setTimeout(() => joinRoomAuto(code), 500);
                return;
            }

            peer = new Peer();
            document.getElementById('lobby-screen').innerHTML = `
                <h2 style="font-family: 'Noto Sans JP', sans-serif; color: #fde047; font-size: 1.4rem; font-weight: 900;">ルームに接続中...</h2>
                <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 1rem;">ホストとの接続を確立しています</p>
            `;

            peer.on('open', () => {
                conn = peer.connect(code);
                setupConnection();
            });

            peer.on('error', (err) => {
                alert('ルームへの接続に失敗しました。ホストがルームを閉じている可能性があります。');
                location.href = window.location.pathname;
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('lobby-screen').style.display = 'none';
                document.getElementById('game-content').style.display = 'flex';
                document.getElementById('round-indicator').style.display = 'block';
                startRoundWithCountdown(1);
            });

            conn.on('data', (data) => {
                if (data.type === 'progress') {
                    lastKnownOpponentProgress = data.progress;
                    document.getElementById('opponent-progress').textContent = `${data.progress}/2`;

                    if (data.roundCompleted && roundResults[data.completedRound] === null) {
                        roundResults[data.completedRound] = false; 
                        handleRoundFinished(data.completedRound);
                    }
                }
            });
        }

        function handleRoundCompletedByMe() {
            if (roundResults[currentRound] !== null) return;
            roundResults[currentRound] = true; 
            
            if (conn && conn.open) {
                conn.send({
                    type: 'progress',
                    progress: progress,
                    roundCompleted: true,
                    completedRound: currentRound
                });
            }

            handleRoundFinished(currentRound);
        }

        function handleRoundFinished(roundNum) {
            isInputLocked = true;

            if (roundNum < 3) {
                const didIWin = roundResults[roundNum];
                const overlay = document.getElementById('round-winner-overlay');
                const title = document.getElementById('round-winner-title');
                const msg = document.getElementById('round-winner-msg');

                if (didIWin) {
                    title.textContent = `ラウンド ${roundNum} 勝利！`;
                    title.style.color = "var(--accent-green)";
                    msg.textContent = `見事あなたがラウンド ${roundNum} を先取しました！`;
                } else {
                    title.textContent = `ラウンド ${roundNum} 終了`;
                    title.style.color = "var(--accent-red)";
                    msg.textContent = `相手が先にラウンド ${roundNum} をクリアしました！`;
                }

                overlay.style.display = 'flex';

                setTimeout(() => {
                    overlay.style.display = 'none';
                    startRoundWithCountdown(roundNum + 1);
                }, 3000);
            } else {
                setTimeout(() => {
                    showFinalScoreScreen();
                }, 1000);
            }
        }

        function showFinalScoreScreen() {
            document.getElementById('game-content').style.display = 'none';
            const overlay = document.getElementById('end-overlay');
            const title = document.getElementById('end-title');
            const subtitle = document.getElementById('end-subtitle');
            const tbody = document.getElementById('score-table-body');

            let winsCount = Object.values(roundResults).filter(res => res === true).length;
            let isOverallWinner = winsCount >= 2;

            if (isOverallWinner) {
                title.textContent = "総合優勝！ (Overall Winner)";
                title.style.color = "var(--accent-green)";
                subtitle.textContent = "全ラウンドを通じた熱戦を制しました！おめでとうございます！";
            } else {
                title.textContent = "敗北 (Loser)";
                title.style.color = "var(--accent-red)";
                subtitle.textContent = "惜しくも敗退となりました。次こそリベンジ！";
            }

            tbody.innerHTML = '';
            for (let r = 1; r <= 3; r++) {
                let tr = document.createElement('tr');
                let resultText = roundResults[r] ? '<span style="color: var(--accent-green); font-weight:700;">勝利</span>' : '<span style="color: var(--accent-red); font-weight:700;">敗北</span>';
                tr.innerHTML = `<td>ラウンド ${r}</td><td>${resultText}</td>`;
                tbody.appendChild(tr);
            }

            overlay.style.display = 'flex';
        }

        function startRoundWithCountdown(roundNum) {
            currentRound = roundNum;
            document.getElementById('round-indicator').textContent = `ラウンド ${roundNum}`;
            isInputLocked = true;
            lastKnownOpponentProgress = 0;

            const overlay = document.getElementById('instruction-overlay');
            const roundTitle = document.getElementById('instr-round-title');
            const mainTitle = document.getElementById('instr-main-title');
            const body = document.getElementById('instr-body');
            const cdNum = document.getElementById('countdown-num');

            if (roundNum === 1) {
                roundTitle.textContent = "ラウンド 1 ルール説明";
                mainTitle.textContent = "スロットイン・モード";
                body.innerHTML = `日本語のターゲット文に合わせて、ボードから正しい英文チャンクを選び、<strong>[スロット 1]、[スロット 2]...</strong> へ順番にはめ込んで文章を完成させてください！`;
                initGameRound1();
            } else if (roundNum === 2) {
                roundTitle.textContent = "ラウンド 2 ルール説明";
                mainTitle.textContent = "全チャンク・スピードレース";
                body.innerHTML = `<strong>全2文の英文チャンクがすべてボード上にシャッフル配置</strong>されます！指示された日本語文の順に正しく英文チャンクを素早く連続選択してください！`;
                initGameRound2();
            } else if (roundNum === 3) {
                roundTitle.textContent = "ラウンド 3 ルール説明";
                mainTitle.textContent = "5択・英単語穴埋めモード";
                body.innerHTML = `文章の空欄（[BLANK]）に入る<strong>正しい英単語を5つの選択肢から選んで</strong>文を完成させてください！各ボタンの下に日本語訳が表示されます。`;
                initGameRound3();
            }

            overlay.style.display = 'flex';
            let count = 10;
            cdNum.textContent = count;

            if (activeCountdownTimer) clearInterval(activeCountdownTimer);

            activeCountdownTimer = setInterval(() => {
                count--;
                cdNum.textContent = count;
                if (count <= 0) {
                    clearInterval(activeCountdownTimer);
                    overlay.style.display = 'none';
                    isInputLocked = false;
                }
            }, 1000);
        }

        function initGameRound1() {
            score = 0;
            progress = 0;
            sentenceQueue = JSON.parse(JSON.stringify(SOURCE_SENTENCES));
            currentSentence = sentenceQueue[0];
            loadRound1Stage();
        }

        function loadRound1Stage() {
            document.getElementById('scaffold-title-text').textContent = "ターゲット（日本語訳の順序）";
            document.getElementById('chunk-grid').className = "chunk-grid";
            gridData = [];
            currentSentence.chunks.forEach((text, index) => {
                gridData.push({
                    text: text,
                    index: index,
                    id: Math.random().toString(36).substring(2, 9),
                    slotted: false
                });
            });
            gridData = shuffle(gridData);

            updatePromptRound1();
            renderRound1Slots();
            renderGridRound1();
        }

        function updatePromptRound1() {
            const box = document.getElementById('jp-prompt-box');
            box.style.display = 'flex';
            box.innerHTML = '';
            currentSentence.jpChunks.forEach((jpText) => {
                const span = document.createElement('span');
                span.className = 'jp-chunk';
                span.textContent = jpText;
                box.appendChild(span);
            });
            const currentSentenceNum = 3 - sentenceQueue.length;
            document.getElementById('sentence-counter').textContent = `文 ${currentSentenceNum} / 2`;
        }

        function renderRound1Slots() {
            const container = document.getElementById('active-container');
            container.className = 'slot-container';
            container.innerHTML = '';

            const expectedLength = currentSentence.chunks.length;
            const currentFilledCount = gridData.filter(item => item.slotted).length;

            for (let i = 0; i < expectedLength; i++) {
                const slottedItem = gridData.find(item => item.index === i && item.slotted);
                const slotDiv = document.createElement('div');

                if (slottedItem) {
                    slotDiv.className = 'filled-slot';
                    slotDiv.textContent = slottedItem.text;
                } else if (i === currentFilledCount) {
                    slotDiv.className = 'empty-slot';
                    slotDiv.textContent = `[ スロット ${i + 1} ]`;
                } else {
                    slotDiv.className = 'empty-slot';
                    slotDiv.textContent = `...`;
                }
                container.appendChild(slotDiv);
            }
        }

        function renderGridRound1() {
            const container = document.getElementById('chunk-grid');
            container.className = "chunk-grid";
            container.innerHTML = '';

            gridData.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'grid-btn';
                if (item.slotted) btn.classList.add('cleared');

                btn.textContent = item.text;
                btn.onclick = () => handleSelectRound1(item, btn);
                container.appendChild(btn);
            });
        }

        function handleSelectRound1(item, btnEl) {
            if (isInputLocked || roundResults[1] !== null) return;
            if (item.slotted) return;
            const currentFilledCount = gridData.filter(i => i.slotted).length;

            if (item.index === currentFilledCount) {
                item.slotted = true;
                renderRound1Slots();
                renderGridRound1();

                if (gridData.every(i => i.slotted)) {
                    setTimeout(() => {
                        progress++;
                        score += 250;
                        updateHUD();

                        sentenceQueue.shift();
                        if (sentenceQueue.length > 0) {
                            currentSentence = sentenceQueue[0];
                            loadRound1Stage();
                            sendSyncProgress();
                        } else {
                            handleRoundCompletedByMe();
                        }
                    }, 300);
                }
            } else {
                btnEl.classList.add('error');
                setTimeout(() => renderGridRound1(), 350);
            }
        }

        function initGameRound2() {
            progress = 0;
            updateHUD();
            sentenceQueue = JSON.parse(JSON.stringify(SOURCE_SENTENCES));
            currentSentence = sentenceQueue[0];
            activeChain = [];

            gridData = [];
            SOURCE_SENTENCES.forEach(s => {
                s.chunks.forEach((text, step) => {
                    gridData.push({
                        text: text,
                        sentenceId: s.id,
                        step: step,
                        id: Math.random().toString(36).substring(2, 9),
                        cleared: false
                    });
                });
            });
            gridData = shuffle(gridData);

            updatePromptRound2();
            renderRound2Chain();
            renderGridRound2();
        }

        function updatePromptRound2() {
            const box = document.getElementById('jp-prompt-box');
            box.style.display = 'flex';
            box.innerHTML = '';
            currentSentence.jpChunks.forEach((jpText) => {
                const span = document.createElement('span');
                span.className = 'jp-chunk';
                span.textContent = jpText;
                box.appendChild(span);
            });
            const currentSentenceNum = 3 - sentenceQueue.length;
            document.getElementById('sentence-counter').textContent = `文 ${currentSentenceNum} / 2`;
        }

        function renderRound2Chain() {
            const container = document.getElementById('active-container');
            container.className = 'chain-container';
            container.innerHTML = '';

            if (activeChain.length === 0) {
                container.innerHTML = '<div class="placeholder-hint">正しい順番でチャンクを選択してください</div>';
                return;
            }
            activeChain.forEach(c => {
                const tag = document.createElement('div');
                tag.className = 'tile-tag';
                tag.textContent = c.text;
                container.appendChild(tag);
            });
        }

        function renderGridRound2() {
            const container = document.getElementById('chunk-grid');
            container.className = "chunk-grid";
            container.innerHTML = '';

            gridData.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'grid-btn';
                if (item.cleared) btn.classList.add('cleared');

                btn.textContent = item.text;
                btn.onclick = () => handleSelectRound2(item, btn);
                container.appendChild(btn);
            });
        }

        function handleSelectRound2(item, btnEl) {
            if (isInputLocked || roundResults[2] !== null || item.cleared || !currentSentence) return;
            const expectedStep = activeChain.length;

            if (item.sentenceId === currentSentence.id && item.step === expectedStep) {
                activeChain.push(item);
                btnEl.classList.add('selected');
                renderRound2Chain();

                if (activeChain.length === currentSentence.chunks.length) {
                    setTimeout(() => {
                        activeChain.forEach(c => c.cleared = true);
                        progress++;
                        score += 350;
                        updateHUD();

                        activeChain = [];
                        renderRound2Chain();
                        renderGridRound2();

                        sentenceQueue.shift();
                        let isDone = (sentenceQueue.length === 0);
                        
                        if (isDone) {
                            handleRoundCompletedByMe();
                        } else {
                            currentSentence = sentenceQueue[0];
                            updatePromptRound2();
                            sendSyncProgress();
                        }
                    }, 200);
                }
            } else {
                btnEl.classList.add('error');
                activeChain = [];
                renderRound2Chain();
                setTimeout(() => renderGridRound2(), 350);
            }
        }

        function initGameRound3() {
            progress = 0;
            updateHUD();
            sentenceQueue = JSON.parse(JSON.stringify(ROUND3_QUESTIONS));
            currentRound3Q = sentenceQueue[0];
            loadRound3Stage();
        }

        function loadRound3Stage() {
            document.getElementById('scaffold-title-text').textContent = "英単語 穴埋め問題";
            const currentQNum = 3 - sentenceQueue.length;
            document.getElementById('sentence-counter').textContent = `問題 ${currentQNum} / 2`;

            const box = document.getElementById('jp-prompt-box');
            box.style.display = 'none';

            const container = document.getElementById('active-container');
            container.className = 'blank-stage';
            
            const htmlSentence = currentRound3Q.fullText.replace('[BLANK]', '<span class="blank-word-slot">______</span>');
            container.innerHTML = `
                <div class="blank-sentence-display">${htmlSentence}</div>
            `;

            renderRound3Options();
        }

        function renderRound3Options() {
            const container = document.getElementById('chunk-grid');
            container.className = "";
            container.innerHTML = '';

            const wrapper = document.createElement('div');
            wrapper.className = 'round3-interaction-area';

            const optionsGrid = document.createElement('div');
            optionsGrid.className = 'word-options-grid';

            const shuffledOptions = shuffle(currentRound3Q.options);
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'word-btn';
                btn.innerHTML = `
                    <span class="word-btn-en">${opt.en}</span>
                    <span class="word-btn-jp">${opt.jp}</span>
                `;
                btn.onclick = () => handleSelectRound3(opt.en, btn);
                optionsGrid.appendChild(btn);
            });

            wrapper.appendChild(optionsGrid);
            container.appendChild(wrapper);
        }

        function handleSelectRound3(selectedWord, btnEl) {
            if (isInputLocked || roundResults[3] !== null) return;

            if (selectedWord === currentRound3Q.targetWord) {
                progress++;
                score += 400;
                updateHUD();

                sentenceQueue.shift();
                let isDone = (sentenceQueue.length === 0);

                if (isDone) {
                    handleRoundCompletedByMe();
                } else {
                    currentRound3Q = sentenceQueue[0];
                    loadRound3Stage();
                    sendSyncProgress();
                }
            } else {
                btnEl.classList.add('error');
                setTimeout(() => btnEl.classList.remove('error'), 350);
            }
        }

        function updateHUD() {
            document.getElementById('hud-progress').textContent = `${progress}/2`;
            document.getElementById('hud-score').textContent = score;
        }

        function sendSyncProgress() {
            if (conn && conn.open) {
                conn.send({
                    type: 'progress',
                    progress: progress,
                    roundCompleted: false
                });
            }
        }
    </script>
</body>
</html>
